[window]
padding         = { x = 8, y = 5 }
dynamic_padding = true
opacity         = 0.7

[scrolling]
multiplier = 2

[font]
normal      = { family = "BigBlueTermPlus Nerd Font", style = "Regular" }
bold        = { family = "BigBlueTermPlus Nerd Font", style = "Regular" }
italic      = { family = "BigBlueTermPlus Nerd Font", style = "Regular" }
bold_italic = { family = "BigBlueTermPlus Nerd Font", style = "Regular" }
size        = 10

[cursor]
style = { shape = "Underline", blinking = "On" }

[terminal]
shell = "/usr/bin/zsh"
